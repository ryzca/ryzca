<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Ryz — Backend Engineer, Osaka, Japan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="120" x2="360" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .fadeup { opacity: 0; animation: fadeup 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.5s; } .d4 { animation-delay: 0.7s; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .phrase { opacity: 0; animation: cycle 12s linear infinite; }
    .p2 { animation-delay: 4s; } .p3 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 28% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: float 7s ease-in-out infinite; }
    .float2 { animation: float 9s ease-in-out 1.2s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>

  <rect x="1" y="1" width="958" height="298" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <circle cx="820" cy="40" r="240" fill="url(#glow1)"/>
  <circle cx="180" cy="300" r="220" fill="url(#glow2)"/>

  <g fill="#30363d" opacity="0.8">
    <circle cx="620" cy="60" r="2.5"/><circle cx="700" cy="120" r="2"/><circle cx="900" cy="200" r="2.5"/>
    <circle cx="560" cy="230" r="2"/><circle cx="860" cy="90" r="2"/><circle cx="760" cy="250" r="2.5"/>
  </g>

  <g class="float" opacity="0.1">
    <text x="700" y="205" font-size="130" font-weight="700" fill="url(#accent)">&#123;&#8202;&#125;</text>
  </g>
  <g class="float2" opacity="0.1">
    <text x="560" y="120" font-size="64" font-weight="700" fill="#58a6ff">&lt;/&gt;</text>
  </g>

  <g class="fadeup d3">
    <text x="928" y="52" text-anchor="end" font-size="13" fill="#8b949e">&#128205; Osaka, Japan</text>
  </g>

  <g class="fadeup d1">
    <text x="66" y="102" font-size="19" fill="#8b949e">Hi there <tspan font-size="21">&#128075;</tspan> I&#8217;m <tspan font-size="24" font-weight="700" fill="url(#accent)">Ryz</tspan></text>
  </g>
  <g class="fadeup d2">
    <text x="66" y="162" font-size="27" font-weight="600" fill="#c9d1d9">Backend Engineer &#8212; with a full-stack toolbox</text>
    <rect x="67" y="180" width="92" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g class="fadeup d4">
    <text x="66" y="240" class="mono" font-size="16" fill="#3fb950">$</text>
    <g class="phrase">
      <text x="84" y="240" class="mono" font-size="16" fill="#8b949e">stack: Ruby on Rails &#183; TypeScript &#183; React <tspan class="cursor" fill="#58a6ff">&#9612;</tspan></text>
    </g>
    <g class="phrase p2">
      <text x="84" y="240" class="mono" font-size="16" fill="#8b949e">building: web products &#183; AI agents &#183; engineering teams <tspan class="cursor" fill="#58a6ff">&#9612;</tspan></text>
    </g>
    <g class="phrase p3">
      <text x="84" y="240" class="mono" font-size="16" fill="#8b949e">note: most of my work lives in private repos <tspan class="cursor" fill="#58a6ff">&#9612;</tspan></text>
    </g>
  </g>
</svg>
